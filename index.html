<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Hola amoooooor</title>
    <style>
        :root {
            --bg: #fdebff;
            --card: #ffffff;
            --si-btn: #ff93d2;
            --no-btn: hsl(273, 90%, 58%);
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
            background-color: var(--bg);
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: var(--card);
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            position: relative;
        }

        .botones {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1rem;
        }

        #btn-si {
            background-color: var(--si-btn);
            color: white;
        }

        #btn-no {
            background-color: var(--no-btn);
            color: white;
        }

        .emoji { font-size: 4rem; }
    </style>
</head>
<body>

    <div class="container" id="main-card">
        <h1>¿Quisieras ser mi San Valentín?</h1>
        <p>yo se que quieres :D</p>

        <div class="botones">
            <button id="btn-si" onclick="aceptar()">Si :D</button>
            <button id="btn-no" onclick="crecerSi()">No D:</button>
        </div>
    </div>

    <script>
        let escalaSi = 1;
        const mensajesNo = [
            "Pero yo te amo", 
            "En serio?", 
            "De verdad?", 
            "Voy a llorar", 
            "No me amas?", 
            ":("
        ];
        let indiceMensaje = 0;

        function crecerSi() {
            const btnSi = document.getElementById('btn-si');
            const btnNo = document.getElementById('btn-no');
            
            escalaSi += 0.5;
            btnSi.style.transform = `scale(${escalaSi})`;
            
            btnNo.innerText = mensajesNo[indiceMensaje];
            indiceMensaje = (indiceMensaje + 1) % mensajesNo.length;

            if (escalaSi > 15) {
                btnNo.style.display = 'none';
            }
        }

        function aceptar() {
            document.getElementById('main-card').innerHTML = `
                <h1>Te amo, sabia que aceptarías</h1>
                <p>Besito °3°</p>
            `;
            document.body.style.backgroundColor = "#ffebf2";
        }
    </script>
</body>
</html>
